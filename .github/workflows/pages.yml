# Publie le site sur GitHub Pages, tel quel (l'éditeur JupyterLite est déjà
# construit dans jupyter-lite/editeur/ par jupyter-lite/build.bat).
#
# Paramètre du dépôt requis : Settings > Pages > Source = « GitHub Actions ».

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Avant, Jekyll ignorait les fichiers « _* » et « .* » : on garde ce
      # comportement pour ne pas publier les dossiers _prof/.
      - name: Copier les pages statiques
        run: |
          mkdir _site
          rsync -a \
            --exclude='.*' \
            --exclude='_*' \
            --exclude='/CLAUDE.md' \
            --exclude='/jupyter-lite/build.bat' \
            ./ _site/

      - name: Vérifier que les dossiers _prof sont exclus
        run: |
          if find _site -path '*/_prof*' | grep -q .; then
            echo "Des dossiers _prof seraient publiés." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
